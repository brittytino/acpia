[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "acpia-agents"
version = "1.0.0"
description = "ACPIA Multi-Agent Analysis Pipeline"
requires-python = ">=3.11"

dependencies = [
    # LangGraph / LangChain
    "langgraph==0.2.0",
    "langchain==0.2.0",
    "langchain-community==0.2.0",
    "langchain-core==0.2.0",
    "langchain-ollama==0.1.1",

    # Task queue
    "celery==5.3.6",
    "celery[redis]==5.3.6",
    "redis==5.0.1",

    # Database
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "neo4j==5.15.0",

    # Object storage
    "minio==7.2.3",

    # ASR — Whisper
    "faster-whisper==1.0.1",
    "pyannote.audio==3.1.1",

    # Vision / Image processing
    "Pillow==10.2.0",
    "pytesseract==0.3.10",
    "opencv-python-headless==4.9.0.80",
    "imagededup==0.3.2",

    # NLP
    "spacy==3.7.2",
    "nltk==3.8.1",
    "transformers==4.37.0",

    # PDF generation
    "weasyprint==60.2",
    "jinja2==3.1.3",

    # Geospatial
    "geopy==2.4.1",

    # HTTP
    "httpx==0.26.0",
    "aiohttp==3.9.1",

    # Data processing
    "pandas==2.1.4",
    "numpy==1.26.3",
    "scikit-learn==1.4.0",

    # Utilities
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "structlog==24.1.0",
    "tenacity==8.2.3",
    "python-magic==0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*"]
