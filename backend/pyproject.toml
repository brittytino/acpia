[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "acpia-backend"
version = "1.0.0"
description = "ACPIA Backend — Agentic Child Protection Investigation Assistant"
requires-python = ">=3.11"

dependencies = [
    # FastAPI & Web
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.7",
    "httpx==0.26.0",
    "websockets==12.0",

    # Database — PostgreSQL
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",

    # Database — Neo4j
    "neo4j==5.15.0",

    # Database — Redis
    "redis==5.0.1",
    "hiredis==2.3.2",

    # Object Storage — MinIO
    "minio==7.2.3",

    # OpenSearch
    "opensearch-py==2.4.2",

    # Auth — Keycloak JWT
    "python-jose[cryptography]==3.3.0",
    "PyJWT==2.8.0",
    "httpx==0.26.0",

    # Async
    "anyio==4.2.0",
    "aiofiles==23.2.1",

    # Task Queue
    "celery==5.3.6",
    "celery[redis]==5.3.6",
    "redbeat==2.1.1",
    "flower==2.0.1",

    # File processing
    "python-magic==0.4.27",
    "Pillow==10.2.0",
    "pytesseract==0.3.10",
    "PyMuPDF==1.23.8",

    # Image deduplication
    "imagededup==0.3.2",

    # PDF Generation
    "weasyprint==60.2",
    "jinja2==3.1.3",

    # Data
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "pandas==2.1.4",
    "numpy==1.26.3",

    # Observability
    "opentelemetry-api==1.22.0",
    "opentelemetry-sdk==1.22.0",
    "opentelemetry-exporter-otlp==1.22.0",
    "opentelemetry-instrumentation-fastapi==0.43b0",
    "opentelemetry-instrumentation-sqlalchemy==0.43b0",
    "prometheus-client==0.19.0",
    "prometheus-fastapi-instrumentator==6.1.0",

    # Utilities
    "python-dotenv==1.0.0",
    "structlog==24.1.0",
    "tenacity==8.2.3",
    "cryptography==42.0.0",
    "passlib[bcrypt]==1.7.4",
    "uuid==1.30",
    "python-dateutil==2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "httpx==0.26.0",
    "factory-boy==3.3.0",
    "black==24.1.1",
    "ruff==0.1.15",
    "mypy==1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
