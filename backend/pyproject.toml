[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acpia-backend"
version = "3.0.0"
description = "ACPIA v3 — From the first screenshot to the courtroom: one unbroken chain."
requires-python = ">=3.11"

dependencies = [
    # FastAPI & Web
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.7",
    "httpx>=0.26.0",
    "websockets>=12.0",

    # Database — Postgres + pgvector only
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",

    # Auth — FastAPI JWT (replaces Keycloak)
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",

    # Async
    "anyio>=4.2.0",
    "aiofiles>=23.2.1",

    # Image/file processing
    "Pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "piexif>=1.1.3",

    # PDF generation (replaces weasyprint)
    "fpdf2>=2.7.9",

    # Data
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "numpy>=1.26.3",

    # Utilities
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.2",

    # Email (SMTP via Gmail App Password)
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "httpx==0.26.0",
    "black==24.1.1",
    "ruff==0.1.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
