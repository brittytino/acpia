services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acpia-postgres
    environment:
      POSTGRES_DB: acpia
      POSTGRES_USER: acpia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
    ports:
      # Bound to loopback only. Postgres must never be reachable off-host —
      # the whole "air-gapped console" claim depends on this.
      - "127.0.0.1:48800:5432"
    volumes:
      - acpia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acpia -d acpia"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: acpia-ollama
    ports:
      # Loopback only — the Ollama API has no auth of its own.
      - "127.0.0.1:48801:11434"
    volumes:
      - acpia_ollama:/root/.ollama
    restart: unless-stopped
    # If you have an NVIDIA GPU, uncomment the following:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acpia-backend
    environment:
      # Database — point to postgres container
      DATABASE_URL: postgresql+asyncpg://acpia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/acpia
      DATABASE_URL_SYNC: postgresql://acpia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/acpia
      DATABASE_URL_APP: postgresql+asyncpg://veritas_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}@postgres:5432/acpia
      DB_APP_ROLE: veritas_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
      # Ollama AI
      OLLAMA_BASE_URL: http://ollama:11434
      # App
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${JWT_SECRET:?Set JWT_SECRET in .env — e.g. openssl rand -base64 48}
      # Explicit opt-in only — creates well-known demo accounts. Leave unset/false
      # for any deployment holding real cases.
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      BACKEND_PORT: "48802"
      STORAGE_PATH: /app/storage
      # CORS — explicit origin allowlist. Never "*": this app sends credentialed
      # requests, and a wildcard origin with allow_credentials=True means any
      # website can make authenticated calls on a logged-in officer's behalf.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:48803","http://localhost:48804"]}
      # Frontend URLs (for email links — point to public-facing ports)
      SEAL_URL: ${SEAL_URL:-http://localhost:48803}
      CONSOLE_URL: ${CONSOLE_URL:-http://localhost:48804}
      # SMTP — unset by default. Set real values (and SMTP_ENABLED=true) in .env.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-VERITAS ACPIA <noreply@acpia.gov.in>}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
    ports:
      - "48802:48802"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - acpia_uploads:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48802/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  seal:
    build:
      context: ./seal
      dockerfile: Dockerfile
    container_name: acpia-seal
    ports:
      - "48803:3000"
    depends_on:
      - backend
    restart: unless-stopped

  console:
    build:
      context: ./police-console
      dockerfile: Dockerfile
    container_name: acpia-console
    ports:
      - "48804:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  acpia_pgdata:
  acpia_ollama:
  acpia_uploads:
