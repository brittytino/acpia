services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acpia-postgres
    environment:
      POSTGRES_DB: acpia
      POSTGRES_USER: acpia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:47800:5432"
    volumes:
      - acpia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acpia -d acpia"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: acpia-ollama
    ports:
      - "127.0.0.1:47801:11434"
    volumes:
      - acpia_ollama:/root/.ollama
    # If you have an NVIDIA GPU, uncomment the following:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  acpia_pgdata:
  acpia_ollama:
