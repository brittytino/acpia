services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acpia-postgres
    environment:
      POSTGRES_DB: acpia
      POSTGRES_USER: acpia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "47800:5432"
    volumes:
      - acpia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acpia -d acpia"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: acpia-ollama
    ports:
      - "47801:11434"
    volumes:
      - acpia_ollama:/root/.ollama
    restart: unless-stopped
    # If you have an NVIDIA GPU, uncomment the following:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acpia-backend
    environment:
      # Database — point to postgres container
      DATABASE_URL: postgresql+asyncpg://acpia:${POSTGRES_PASSWORD:-password}@postgres:5432/acpia
      DATABASE_URL_SYNC: postgresql://acpia:${POSTGRES_PASSWORD:-password}@postgres:5432/acpia
      DATABASE_URL_APP: postgresql+asyncpg://veritas_app:veritas_app_dev_pw@postgres:5432/acpia
      DB_APP_ROLE: veritas_app
      DB_APP_PASSWORD: veritas_app_dev_pw
      # Ollama AI
      OLLAMA_BASE_URL: http://ollama:11434
      # App
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${JWT_SECRET:-acpia_super_secret_key_change_in_production_2026}
      BACKEND_PORT: "47802"
      STORAGE_PATH: /app/storage
      # CORS — allow all origins for cloud deployment
      CORS_ORIGINS: '["*"]'
      # Frontend URLs (for email links — point to public-facing ports)
      SEAL_URL: http://localhost:47803
      CONSOLE_URL: http://localhost:47804
      # SMTP
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: barathvikraman.clovertech@gmail.com
      SMTP_PASSWORD: ldqjpvtigidttnqz
      SMTP_FROM: "VERITAS ACPIA <barathvikraman.clovertech@gmail.com>"
      SMTP_ENABLED: "true"
    ports:
      - "47802:47802"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - acpia_uploads:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:47802/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  seal:
    build:
      context: ./seal
      dockerfile: Dockerfile
    container_name: acpia-seal
    ports:
      - "47803:3000"
    depends_on:
      - backend
    restart: unless-stopped

  console:
    build:
      context: ./police-console
      dockerfile: Dockerfile
    container_name: acpia-console
    ports:
      - "47804:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  acpia_pgdata:
  acpia_ollama:
  acpia_uploads:
